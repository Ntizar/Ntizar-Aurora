<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" width="340" height="100">
  <title>Aurora Logo — All White</title>
  <!-- Symbol group: scaled and positioned -->
  <g transform="translate(10, 10) scale(0.8)">
    <!-- Constellation lines (40% opacity) -->
    <g stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" opacity="0.4">
      <line x1="50" y1="48" x2="30" y2="22"/>
      <line x1="50" y1="48" x2="72" y2="20"/>
      <line x1="50" y1="48" x2="80" y2="56"/>
      <line x1="50" y1="48" x2="26" y2="70"/>
      <line x1="50" y1="48" x2="62" y2="78"/>
      <line x1="30" y1="22" x2="72" y2="20"/>
      <line x1="72" y1="20" x2="80" y2="56"/>
      <line x1="26" y1="70" x2="12" y2="42"/>
      <line x1="26" y1="70" x2="62" y2="78"/>
    </g>
    <!-- Star dots -->
    <circle cx="30" cy="22" r="3.5" fill="#ffffff"/>
    <circle cx="72" cy="20" r="4" fill="#ffffff"/>
    <circle cx="80" cy="56" r="2.5" fill="#ffffff"/>
    <circle cx="12" cy="42" r="1.8" fill="#ffffff"/>
    <circle cx="26" cy="70" r="3" fill="#ffffff"/>
    <circle cx="62" cy="78" r="2" fill="#ffffff"/>
    <circle cx="50" cy="48" r="6" fill="#ffffff"/>
  </g>
  <!-- Wordmark -->
  <text x="106" y="62" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" letter-spacing="-1" fill="#ffffff">aurora</text>
</svg>
