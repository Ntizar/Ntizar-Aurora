<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App móvil · Ntizar Aurora</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Ntizar/Ntizar-Aurora@master/ntizar.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Ntizar/Ntizar-Aurora@master/ntizar.nucleo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Ntizar/Ntizar-Aurora@master/ntizar.app.css">
<style>body{margin:0;font-family:var(--nz-font-sans);background:var(--nz-surface-page);color:var(--nz-text-strong);}
.wrap{max-width:480px;margin:0 auto;padding:1rem;min-height:100vh;}</style>
</head>
<body class="nz" data-nz-theme="light">
<div class="wrap">
<header class="nz-app__header">
<span class="nz-eyebrow" style="margin:0;">Kit72h</span>
<span class="nz-app__title">Mis kits</span>
</header>
<main class="nz-app__main">
<div class="nz-kpirow">
<div class="nz-kpirow__tile"><span class="nz-kpirow__label">Kits activos</span><span class="nz-kpirow__value">3</span></div>
<div class="nz-kpirow__tile"><span class="nz-kpirow__label">Caducan</span><span class="nz-kpirow__value">2</span></div>
<div class="nz-kpirow__tile"><span class="nz-kpirow__label">Cobertura</span><span class="nz-kpirow__value">78%</span></div>
</div>
<div class="nz-chips">
<button class="nz-chips__chip is-active" type="button">Todos</button>
<button class="nz-chips__chip" type="button">Agua</button>
<button class="nz-chips__chip" type="button">Botiquín</button>
</div>
<div class="nz-list">
<div class="nz-list__item"><div class="nz-list__body"><p class="nz-list__title">Kit 72h familiar</p><p class="nz-list__meta">18 items · revisado hace 12 días</p></div><div class="nz-list__actions"><button class="nz-list__btn" aria-label="Editar">✎</button><button class="nz-list__btn nz-list__btn--danger" aria-label="Borrar">✕</button></div></div>
<div class="nz-list__item"><div class="nz-list__body"><p class="nz-list__title">Kit bebé</p><p class="nz-list__meta">9 items · revisado hace 30 días</p></div><div class="nz-list__actions"><button class="nz-list__btn" aria-label="Editar">✎</button><button class="nz-list__btn nz-list__btn--danger" aria-label="Borrar">✕</button></div></div>
</div>
</main>
<nav class="nz-app__tabbar" aria-label="Navegación principal">
<a class="nz-app__tab is-active" href="#" aria-current="page">🏠<span>Inicio</span></a>
<a class="nz-app__tab" href="#">📦<span>Kits</span></a>
<a class="nz-app__tab" href="#">📊<span>Estado</span></a>
<a class="nz-app__tab" href="#">⚙️<span>Ajustes</span></a>
</nav>
<button class="nz-app__fab" aria-label="Nuevo kit">+</button>
</div>
</body>
</html>
